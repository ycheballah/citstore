  <title>Login</title>
  <link rel="stylesheet" href="store.css">
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>
<div class="login-box">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="message"></div>
</div>

    <script>
      function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // Call the server-side checkLogin function
        google.script.run
          .withSuccessHandler(function(isValid) {
            if (isValid) {
              document.getElementById('message').innerText = "Login Successful!";
              // Redirect to your app's main page or dashboard here
            } else {
              document.getElementById('message').innerText = "Invalid credentials.";
            }
          })
          .checkLogin(user, pass);
      }
    </script>
  </body>
