<!DOCTYPE html>
<html>
<head>
  <title>CIT Store Admin Dashboard</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
<div class="banner-container">
  <div style="background-color: rgba(0, 0, 0, 0.6); color: white; padding: 200px; text-align: center;">
      <!-- Video Element -->
  <video autoplay muted loop  class="back-video">
      <source src="banner videos.mp4" type="video/mp4">
  </video>
  
  <!-- Banner Text/Content -->
  <div class="content">
      <h1>Admin Page</h1>
  </div>
</div>

<!-- Not showing up on admin page, i think it's because the banner is blocking them -->
<input id="name" placeholder="Item name">
<input id="price" placeholder="Price">
<input id="image" placeholder="Image">
<button onclick="addItem()"> Add Item</button>
<script>
const APPSCRIPT = "https://script.google.com/macros/s/AKfycbyljcQ1Kd-PN78c2f0k-t8wreE7nDR0hpH4hh38KkS4tlhm0aHn8gl9zmAffLMnKxekFA/exec";
function addItem() {
  let item = {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value
  };
  fetch(APPSCRIPT, {
    method: "POST",
    body: JSON.stringify(item)
  })
  .then(res=>res.text())
  .then(data=>{
    alert("Item Added Successfully!")
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("image").value="";
  })
  .catch(err => {
  console.error("ERROR:", err);
  alert("Something failed — check console");
});
}
</script>
</body>
</html>
