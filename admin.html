<!DOCTYPE html>
<html>
<head>
  <title>CIT Store Admin Dashboard</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <style>
    .main-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }
  
    .back-video {
      position: absolute;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1; /* Puts video in back */
      object-fit: cover;
    }
  
    .content {
      position: relative;
      z-index: 1; /* Puts text above video */
      color: white;
      text-align: center;
      padding-top: 100px;
    }
  
    .input-area {
      position: relative;
      z-index: 10; /* Ensures inputs are clickable */
      text-align: center;
      margin-top: 20px;
    }
  </style>
  
  <nav>
    <ul>
      <div class= "header-container">
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="loginpage.html">Admin Login</a>
      <a href="#contact">Contact</a>
      </div>
    </ul>
  </nav>
  
  <div class="main-container">
    <!-- Video Element -->
    <video autoplay muted loop class="back-video">
      <source src="banner videos.mp4" type="video/mp4">
    </video>
  
    <!-- Banner Text/Content -->
    <div class="content">
      <h1>Admin Page</h1>
    </div>
  
    <!-- Inputs now inside a positioned container -->
    <div class="input-area">
      <input id="name" placeholder="Item name">
      <input id="price" placeholder="Price">
      <input id="image" placeholder="Image">
      <button onclick="addItem()">Add Item</button>
    </div>
  </div>
<script>
const APPSCRIPT = "https://script.google.com/macros/s/AKfycbyljcQ1Kd-PN78c2f0k-t8wreE7nDR0hpH4hh38KkS4tlhm0aHn8gl9zmAffLMnKxekFA/exec";
function addItem() {
  let item = {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value
  };
  fetch(APPSCRIPT, {
    method: "POST",
    body: JSON.stringify(item)
  })
  .then(res=>res.text())
  .then(data=>{
    alert("Item Added Successfully!")
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("image").value="";
  })
  .catch(err => {
  console.error("ERROR:", err);
  alert("Something failed — check console");
});
}
</script>
</body>
</html>
