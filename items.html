<!DOCTYPE html>
<html>
<head>
  <title>CIT Store Item</title>
</head>
<body>
<div id="item"></div>
<script>
const APPSCRIPT = "https://script.google.com/macros/s/AKfycbyHAhqFdsQqiGng7AN76cn4KEZ9qocoX6Zya5dKAPlf9sSvHgYYomWj5IKqKcxlYlDrQA/exec";
let params = new URLSearchParams(window.location.search);
let id = params.get("id");
fetch(APPSCRIPT)
  .then(res => res.json())
  .then(items => {
    let item = items.find(i=>i.id == id);
    let container = document.getElementById("item");
    if (item) {
      container.innerHTML = '
        <h1>${item.name}</h1>
        <p>Price: $${item.price}</p>
        ';
     } else {
      container.innerHTML = "Item Not Found";
    }
  });
</script>
</body>
</html>
