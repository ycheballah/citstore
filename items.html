<!DOCTYPE html>
<html>
<head>
  <title>CIT Store Item</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <nav>
    <ul>
      <div class= "header-container">
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
      <a href="loginpage.html">Admin Login</a>
      <a href="#contact">Contact</a>
      </div>
    </ul>
  </nav>
<div id="item"></div>
<div class="banner-container">
  <div style="background-color: rgba(0, 0, 0, 0.6); color: white; padding: 200px; text-align: center;">
      <!-- Video Element -->
  <video autoplay muted loop  class="back-video">
      <source src="banner videos.mp4" type="video/mp4">
  </video>
  
  <!-- Banner Text/Content -->
  <div class="content">
      <h1>ITEM_NAME</h1>
  </div>
</div>
<script>
const APPSCRIPT = "https://script.google.com/macros/s/AKfycbyljcQ1Kd-PN78c2f0k-t8wreE7nDR0hpH4hh38KkS4tlhm0aHn8gl9zmAffLMnKxekFA/exec";
let params = new URLSearchParams(window.location.search);
let id = params.get("id");
fetch(APPSCRIPT)
  .then(res => res.json())
  .then(items => {
    let item = items.find(i=>i.id == id);
    let container = document.getElementById("item");
    if (item) {
      container.innerHTML = `
        <h1>${item.name}</h1>
        <p>Price: $${item.price}</p>
      `;
     } else {
      container.innerHTML = "Item Not Found";
    }
  });
</script>
</body>
</html>
