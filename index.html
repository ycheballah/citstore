<!DOCTYPE html>
<html>
<head>
  <title>CIT Store</title>
  <link rel="stylesheet" href="store.css">

</head>
<nav>
  <ul>
    <div class= "header-container">
    <li></li>
    <a href="index.html">Home</a>
    <a href="admin.html">Admin</a>
    <a href="loginpage.html">Admin Login</a>
    <a href="#contact">Contact</a>
    </div>
  </ul>
</nav>
<div class="banner-container">
  <div style="background-color: rgba(0, 0, 0, 0.6); color: white; padding: 200px; text-align: center;">
      <!-- Video Element -->
  <video autoplay muted loop  class="back-video">
      <source src="banner videos.mp4" type="video/mp4">
  </video>
  
  <!-- Banner Text/Content -->
  <div class="content">
      <h1>CIT STORE</h1>
  </div>
</div>
<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbyljcQ1Kd-PN78c2f0k-t8wreE7nDR0hpH4hh38KkS4tlhm0aHn8gl9zmAffLMnKxekFA/exec";
document.addEventListener("DOMContentLoaded", () => {
  loadItems();
});
function loadItems() {
  const list = document.getElementById("list");
  list.innerHTML = "Loading items...";
  const callbackName = "jsonpCallback_" + Math.floor(Math.random() * 1000000);
  const script = document.createElement("script");
  window[callbackName] = function(data) {
    list.innerHTML = "";
    if (!data || data.length === 0) {
      list.innerHTML = "No items found.";
      cleanup();
      return;
    }
    data.forEach(item => {
      const a = document.createElement("a");
      a.href = "item.html?id=" + item.id;
      a.textContent = `${item.name} $${item.price}`;
      a.style.display = "block";
      a.style.margin = "10px 0";
      list.appendChild(a);
    });
    cleanup();
  };

  script.onerror = function() {
    list.innerHTML = "Error loading store.";
    cleanup();
  };
  function cleanup() {
    if (document.body.contains(script)) {
      document.body.removeChild(script);
    }
    delete window[callbackName];
  }
  script.src = `${scriptURL}?action=getItems&callback=${callbackName}`;
  document.body.appendChild(script);
}
</script>
</body>
</html>
