<!DOCTYPE html>
<html>
<head>
  <title>CIT Store</title>
</head>
<body>
<h1>Items</h1>
<div id="list"></div>
<link rel="stylesheet" href="store. css">
<script>
const APPSCRIPT = "https://script.google.com/macros/s/AKfycbyHAhqFdsQqiGng7AN76cn4KEZ9qocoX6Zya5dKAPlf9sSvHgYYomWj5IKqKcxlYlDrQA/exec";
fetch(APPSCRIPT)
  .then(res => res.json())
  .then(items => {
    let list = document.getElementById("list");
    item.forEach(item => {
      let a = document.createElement("a");
      a.href = "item.html?id=" + item.id;
      a.textContent = item.name + " $" + item.price;
      list.appendChild(a);
    });
  });
</script>
</body>
</html>
